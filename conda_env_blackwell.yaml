name: iws
channels:
  - pytorch
  - nvidia
  - conda-forge
  - xformers
dependencies:
  - python=3.11
  - pip=24.2
  - setuptools=80.10.1
  - uv
  # CUDA toolchain bumped 12.6 -> 12.8 for Blackwell (sm_120) support
  - cuda-toolkit=12.8.0
  - cuda-nvcc=12.8
  - cuda=12.8.0
  - cuda-tools=12.8.0
  - cuda-version=12.8
  - cuda-command-line-tools=12.8.0
  - cuda-compiler=12.8.0
  - cuda-runtime=12.8.0
  - gxx=12.1.0
  - numba==0.59.0
  - ipykernel=6.16
  - zarr=2.12.0
  - numcodecs=0.11.0
  - h5py=3.7.0
  - hydra-core=1.3.2
  - einops=0.8.0
  - omegaconf=2.3.0
  - colorama=0.4.6
  - tqdm=4.66.6
  - click=8.1.7
  # GL software-render lib kept in conda; ffmpeg/moviepy/imageio moved to pip
  # (imageio-ffmpeg pip wheel bundles its own ffmpeg binary) to avoid the
  # conda ffmpeg<->zlib<->cmake conflict.
  - mesalib
  - cmake=4.1.0
