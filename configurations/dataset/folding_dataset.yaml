defaults:
  - base_dataset

# qcez folding (ALOHA), EEF action mode (bimanual_fold, action_dim=8). See PIPELINE_PLAN.md D1.
dataset_dir: data/folding
horizon: 16
val_horizon: 16
aug_mode: none
n_frames: ${dataset.horizon}
observation_shape: [3, "${dataset.resolution}", "${dataset.resolution}"]
context_length: 2
frame_skip: ${dataset.skip_frame}
skip_frame: 1
pad_after: 7
pad_before: 1
rotation_rep: rotation_6d
seed: 42
val_ratio: 0.1
skip_idx: 1
use_cache: false
resolution: 128
obs_keys: [cam_high]
low_dim_keys: []
delta_action: false
goal_sample: intermediate
action_mode: bimanual_fold
load_mask: false
shape_meta:
  action:
    shape:
    - 8
  obs:
    cam_high:
      shape:
      - 3 # C
      - 128 # H
      - 128 # W
      type: rgb
